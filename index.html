<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TERIMA EMAIL</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f5fa;
  color: #222;
}
header {
  background: #202b45;
  color: white;
  padding: 22px;
  text-align: center;
}
.container {
  padding: 20px;
}
.card {
  background: white;
  padding: 20px;
  border-radius: 14px;
  margin-bottom: 18px;
  box-shadow: 0 2px 10px #ddd;
}
input, button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  box-sizing: border-box;
  border-radius: 8px;
}
input {
  border: 1px solid #ccc;
}
button {
  background: #2563eb;
  color: white;
  border: none;
  font-weight: bold;
}
.balance {
  font-size: 28px;
  color: #16834a;
  font-weight: bold;
}
</style>
</head>
<body>

<header>
<h2>TERIMA EMAIL</h2>
<p>Dashboard Penerimaan Email</p>
</header>

<div class="container">

<div class="card">
<h3>Saldo Kamu</h3>
<div class="balance">Rp 0</div>
</div>

<div class="card">
<h3>Kirim Email</h3>
<input type="email" id="email"
placeholder="Masukkan alamat email">
<button onclick="kirim()">KIRIM EMAIL</button>
<p id="hasil"></p>
</div>

<div class="card">
<h3>Riwayat Pengiriman</h3>
<div id="riwayat">Belum ada riwayat.</div>
</div>

</div>

<script>
function kirim() {
 const email = document.getElementById("email").value;
 if (!email || !email.includes("@")) {
   alert("Masukkan alamat email yang valid!");
   return;
 }
 document.getElementById("hasil").innerText =
 "Permintaan berhasil dicatat di halaman ini.";
 document.getElementById("email").value = "";
}
</script>

</body>
</html>
